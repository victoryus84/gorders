services:
  postgres:
    image: postgres:16-alpine
    container_name: gorders-postgres
    ports:
      # BEST PRACTICE: Ascultă DOAR pe localhost-ul serverului Debian.
      # DBeaver NU se mai poate conecta direct prin IP, doar prin SSH Tunnel.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

  api:
    container_name: gorders-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Securizat: Doar localhost (Nginx se ocupă de restul)
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: ["/app/server"]
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

# REDIS - Caching și sesiuni rapide
  redis:
    image: redis/redis-stack:latest
    container_name: gorders-redis
    ports:
      - "6379:6379"   # Portul pentru date
      - "8001:8001"   # Redis Insight (Interfața vizuală - deschide în browser localhost:8001)
    volumes:
      - redis_data:/data

  # KAFKA - Mesagerie asincronă (Evenimente)
  kafka:
    image: apache/kafka:latest
    container_name: gorders-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
     KAFKA_NODE_ID: 1
     KAFKA_PROCESS_ROLES: broker,controller
     KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
     KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS} # Dinamic din .env!
     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
      
  
  adminer:
    image: adminer
    container_name: gorders-adminer
    restart: always
    ports:
      # Aceasta e singura excepție: Îl lăsăm accesibil ca să poți vedea datele din browser
      - "8888:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    image: nginx:alpine
    container_name: gorders-nginx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env  
    volumes:
      - ./nginx/secure/:/etc/nginx/templates/
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/99-autoreload.sh:/docker-entrypoint.d/99-autoreload.sh
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  certbot:
    image: certbot/certbot
    container_name: gorders-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  kafka_data: